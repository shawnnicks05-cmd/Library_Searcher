{% extends "layout.html" %}
{% block content %}

<div id="panel-home" class="sub-panel" style="display: block;">

    <section class="book-row-section">
        <h2>Continue Reading</h2>
        <div class="book-slider">
            <div class="book-card progress-card">
                <div class="book-cover cover-1"><span>Neuromancer</span></div>
                <div class="progress-container">
                    <div class="progress-bar" style="width: 0%;"></div>
                    <span class="progress-text">Not started yet</span>
                </div>
            </div>
            <div class="book-card progress-card">
                <div class="book-cover cover-2"><span>Foundation</span></div>
                <div class="progress-container">
                    <div class="progress-bar" style="width: 0%;"></div>
                    <span class="progress-text">Not started yet</span>
                </div>
            </div>
        </div>
    </section>

    {% for category, books in catalog.items() %}
        <section class="book-row-section">
            <h2>{{ category }} Recommendations</h2>
            <div class="book-slider">
                {% for book in books %}
                    <a href="{{ url_for('book_detail', category=book['category'], title=book['title']) }}"
                       style="text-decoration: none;">
                        <div class="book-card" style="width: 130px; cursor: pointer;">
                            <div style="width: 130px; height: 190px; border-radius: 6px; overflow: hidden;">
                                <img src="{{ url_for('static', filename='Book_Covers/' ~ category ~ '/' ~ book['cover_image']) }}"
                                     alt="{{ book['title'] }}"
                                     style="width: 100%; height: 100%; object-fit: cover;">
                            </div>
                            <p style="margin-top: 8px; font-weight: bold; font-size: 13px; color: #fff;
                                       text-align: center; word-wrap: break-word;">
                                {{ book['title'] }}
                            </p>
                        </div>
                    </a>
                {% endfor %}
            </div>
        </section>
    {% endfor %}

</div>

{% endblock %}
