{% extends "layout.html" %}
{% block content %}

<div id="panel-book-detail" class="sub-panel" style="display: block;">
    <div style="max-width: 800px; margin: 0 auto; padding: 30px;">

        <a href="javascript:history.back()"
           style="color: #aaa; text-decoration: none; font-size: 14px;">
            ← Back
        </a>

        <div style="display: flex; gap: 40px; margin-top: 24px; flex-wrap: wrap;">

            <!-- Cover -->
            <div style="flex-shrink: 0;">
                {% if cover_image %}
                    <img src="{{ url_for('static', filename='Book_Covers/' ~ category ~ '/' ~ cover_image) }}"
                         alt="{{ title }}"
                         style="width: 180px; height: 260px; object-fit: cover;
                                border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
                {% else %}
                    <div style="width: 180px; height: 260px; background: #333; border-radius: 8px;
                                display: flex; align-items: center; justify-content: center; color: #aaa;">
                        No Cover
                    </div>
                {% endif %}
            </div>

            <!-- Info -->
            <div style="flex: 1; min-width: 200px;">
                <h1 style="color: #fff; margin: 0 0 8px;">{{ title }}</h1>
                <p style="color: #aaa; font-size: 14px; margin: 0 0 4px;">
                    ✍️ <strong style="color: #ddd;">{{ meta.author }}</strong>
                </p>
                <p style="color: #aaa; font-size: 14px; margin: 0 0 20px;">
                    📅 {{ meta.year }} &nbsp;·&nbsp; 🏷️ {{ category }}
                </p>
                <p style="color: #ccc; font-size: 15px; line-height: 1.7; margin-bottom: 30px;">
                    {{ meta.description }}
                </p>

                <!-- Buttons -->
                <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">

                    <!-- Like button -->
                    <!-- Like button -->
                    <button id="likeBtn"
                            onclick="toggleLike('{{ category }}', '{{ title }}')"
                            class="like-btn {% if user_liked %}liked{% endif %}">
                        {% if user_liked %}❤️ Liked{% else %}🤍 Like{% endif %}
                    </button>

                    <!-- Like count -->
                    <span id="likeCount"
                          style="color: #aaa; font-size: 14px;">
                        {{ like_count }} {{ 'like' if like_count == 1 else 'likes' }}
                    </span>

                    <!-- Read button -->
                    <a href="{{ url_for('book_read', category=category, title=title) }}"
                       style="padding: 10px 24px; border-radius: 6px; background: #3498db;
                              color: #fff; font-size: 15px; text-decoration: none;">
                        📖 Read Book
                    </a>

                </div>
            </div>
        </div>
    </div>
</div>
<style>
    .like-btn {
        padding: 10px 24px;
        border-radius: 6px;
        border: 2px solid #e74c3c;
        cursor: pointer;
        font-size: 15px;
        transition: all 0.2s;
        background: transparent;
        color: #e74c3c;
    }
    .like-btn.liked {
        background: #e74c3c;
        color: #fff;
    }
</style>
<script>
    async function toggleLike(category, title) {
    const res = await fetch(`/api/like/${encodeURIComponent(category)}/${encodeURIComponent(title)}`, {
        method: 'POST'
    });
    const data = await res.json();

    const btn = document.getElementById('likeBtn');
    const countEl = document.getElementById('likeCount');

    if (data.liked) {
        btn.classList.add('liked');
        btn.textContent = '❤️ Liked';
    } else {
        btn.classList.remove('liked');
        btn.textContent = '🤍 Like';
    }

    countEl.textContent = `${data.count} ${data.count === 1 ? 'like' : 'likes'}`;
}
</script>

{% endblock %}
