<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Searcher Template</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="app-workspace">
        <nav class="navbar">
            <div class="nav-left">
                <div class="home-icon">
                    <a href="{{ url_for('dashboard') }}" class="circle-btn" title="Go to Dashboard">
                        <i class="fa-solid fa-house"></i>
                    </a>
                </div>
                <span href="{{ url_for('dashboard') }}" class="home-btn" style="text-decoration: none;">Library Searcher</span>
            </div>
            <div class="nav-right">
                <div class="search-container">
                    <input type="text" placeholder="Search books, genres..." class="search-input">
                    <div class="search-dropdown">
                        <div class="dropdown-section">
                            <h4>Suggested For You</h4>
                            <div class="genre-tags"><span class="tag">Trending Books</span></div>
                        </div>
                        <div class="dropdown-section">
                            <h4>Recent Searches</h4>
                            <ul class="recent-list">
                                <li class="empty-text">No recent searches</li>
                            </ul>
                        </div>
                    </div>
                </div>
                <a href="{{ url_for('profile') }}" class="profile-link">
                    <div class="profile-container">
                        <i class="fa-solid fa-circle-user profile-icon"></i>
                        <div class="username">{{ username }}</div>
                    </div>
                </a>
            </div>
        </nav>

        <div class="view-container">
            {% block content %}{% endblock %}
        </div>
    </div>

</body>
</html>
