<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Searcher</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="app-workspace">
        <nav class="navbar">
            <div class="nav-left">
                <div class="home-icon">
                    <a href="{{ url_for('dashboard') }}" class="circle-btn" title="Go to Dashboard">
                        <i class="fa-solid fa-house"></i>
                    </a>
                </div>
                <span class="home-btn">Library Searcher</span>
            </div>
            <div class="nav-right">
                <div class="search-container">
                    <input type="text"
                           id="searchInput"
                           placeholder="Search books, categories..."
                           class="search-input"
                           autocomplete="off">
                    <div class="search-dropdown" id="searchDropdown" style="display:none;">
                        <div class="dropdown-section">
                            <h4>Suggested For You</h4>
                            <div class="genre-tags">
                                <span class="tag" onclick="doSearch('Fantasy')">Fantasy</span>
                                <span class="tag" onclick="doSearch('Fiction')">Fiction</span>
                                <span class="tag" onclick="doSearch('Sci-Fi')">Sci-Fi</span>
                            </div>
                        </div>
                        <div class="dropdown-section" id="liveSuggestions" style="display:none;">
                            <h4>Suggestions</h4>
                            <ul class="recent-list" id="suggestionsList"></ul>
                        </div>
                        <div class="dropdown-section">
                            <h4>Recent Searches</h4>
                            <ul class="recent-list" id="recentList">
                                <li class="empty-text">No recent searches</li>
                            </ul>
                        </div>
                    </div>
                </div>
                <a href="{{ url_for('profile') }}" class="profile-link">
                    <div class="profile-container">
                        <i class="fa-solid fa-circle-user profile-icon"></i>
                        <div class="username">{{ username }}</div>
                    </div>
                </a>
            </div>
        </nav>

        <div class="view-container">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const dropdown = document.getElementById('searchDropdown');
        const suggestionsList = document.getElementById('suggestionsList');
        const liveSuggestions = document.getElementById('liveSuggestions');
        const recentList = document.getElementById('recentList');

        let debounceTimer;

        searchInput.addEventListener('focus', () => {
            dropdown.style.display = 'block';
            loadRecentSearches();
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                dropdown.style.display = 'none';
            }
        });

        searchInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => fetchSuggestions(searchInput.value), 250);
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doSearch(searchInput.value);
        });

        function doSearch(query) {
            if (query.trim()) {
                window.location.href = `/search?q=${encodeURIComponent(query.trim())}`;
            }
        }

        async function fetchSuggestions(query) {
            if (query.length < 1) {
                liveSuggestions.style.display = 'none';
                return;
            }
            const res = await fetch(`/api/search-suggestions?q=${encodeURIComponent(query)}`);
            const data = await res.json();

            suggestionsList.innerHTML = '';

            if (data.length) {
                data.forEach(book => {
                    const li = document.createElement('li');
                    li.style.cursor = 'pointer';
                    li.style.display = 'flex';
                    li.style.alignItems = 'center';
                    li.style.gap = '10px';
                    li.style.padding = '8px';

                    li.innerHTML = `
                        <img src="${book.cover_image}" alt="cover" style="width: 30px; height: 40px; object-fit: cover; border-radius: 4px;">
                        <div>
                            <div style="font-weight: 500;">📖 ${book.title}</div>
                            <div style="font-size: 0.8rem; color: #888;">🏷️ ${book.category}</div>
                        </div>
                    `;
                    
                    li.onclick = () => doSearch(book.title);
                    suggestionsList.appendChild(li);
                });
                liveSuggestions.style.display = 'block';
            } else {
                const li = document.createElement('li');
                li.style.padding = '8px';
                li.style.color = '#ff4d4d';
                li.style.fontStyle = 'italic';
                li.style.listStyleType = 'none';
                li.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i>No results found`;
                suggestionsList.appendChild(li);
                liveSuggestions.style.display = 'block';
            }
        }

        async function loadRecentSearches() {
            const res = await fetch('/api/recent-searches');
            const recent = await res.json();
            if (recent.length) {
                recentList.innerHTML = recent
                    .map(q => `<li style="cursor:pointer" onclick="doSearch('${q}')">${q}</li>`)
                    .join('');
            }
        }
    </script>

</body>
</html>
