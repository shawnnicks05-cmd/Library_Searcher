{% extends "layout.html" %}
{% block content %}

<div class="reading-body" id="panel-book-read">
    <div class="reader-container">

        <a href="javascript:history.back()" class="back-btn">
            ← Back to Book
        </a>

        <header class="book-header">
            <h1>{{ title }}</h1>
            <div class="book-meta">
                <span class="category-badge">🏷️ {{ category }}</span>
            </div>
        </header>

        <hr class="reader-divider">

        <article class="book-content-stream">
            {{ content }}
        </article>

        <footer class="reader-footer">
            ✦ END OF SELECTION ✦
        </footer>

    </div>
</div>

{% endblock %}
