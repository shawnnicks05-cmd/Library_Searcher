{% extends "layout.html" %}
{% block content %}

<div id="panel-book-read" class="sub-panel" style="display: block;">
    <div class="panel-container" style="max-width: 750px; margin: 0 auto; padding: 30px;">

        <a href="javascript:history.back()"
           style="color: #aaa; text-decoration: none; font-size: 14px;">
            ← Back to Book
        </a>

        <h1 style="color: #fff; margin: 20px 0 4px;">{{ title }}</h1>
        <p style="color: #aaa; font-size: 13px; margin-bottom: 30px;">🏷️ {{ category }}</p>

        <hr style="border-color: #333; margin-bottom: 30px;">

        <div style="color: #ddd; font-size: 16px; line-height: 1.9;
                    white-space: pre-wrap; font-family: Georgia, serif;">
            {{ content }}
        </div>

    </div>
</div>

{% endblock %}
