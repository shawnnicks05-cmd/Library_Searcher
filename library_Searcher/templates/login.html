<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Library Searcher</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="view-panel auth-screen" style="display: flex;">
        <div class="auth-wrapper">
            <h1 class="auth-logo">Library Searcher</h1>
            
            <div class="auth-box-container">
                <div class="auth-box">
                    <h2>Sign In</h2>
                    <form action="{{ url_for('login') }}" method="POST">
                        
                        <!-- USERNAME FIELD -->
                        <div class="input-group">
                            <input name="username" type="text" placeholder="Username" value="{{ username or '' }}" required>
                            {% if username_err %}
                                <span class="field-error-msg" style="color: #ff4a4a; font-size: 12px; display: block; margin-top: 5px;">
                                    {{ username_err }}
                                </span>
                            {% endif %}
                        </div>
                        
                        <!-- PASSWORD FIELD -->
                        <div class="input-group" style="margin-top: 15px;">
                            <input name="password" type="password" placeholder="Password" required>
                            {% if password_err %}
                                <span class="field-error-msg" style="color: #ff4a4a; font-size: 12px; display: block; margin-top: 5px;">
                                    {{ password_err }}
                                </span>
                            {% endif %}
                        </div>
                        
                        <button type="submit" class="auth-btn center-text" style="margin-top: 20px;">Sign In</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
